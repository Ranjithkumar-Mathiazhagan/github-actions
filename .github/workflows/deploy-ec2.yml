name: Build and Deploy to EC2

on: [push]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set_tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/flask_app:${{ steps.set_tag.outputs.tag }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask_app:${{ steps.set_tag.outputs.tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flask_app:${{ needs.build-and-push.outputs.image_tag }}
            docker stop flask_app || true
            docker rm flask_app || true
            docker run -d --name flask_app -p 5001:5001 ${{ secrets.DOCKERHUB_USERNAME }}/flask_app:${{ needs.build-and-push.outputs.image_tag }}
